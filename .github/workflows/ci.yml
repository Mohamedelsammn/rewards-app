name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    name: Analyze, format check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  build-web:
    name: Build web (smoke test)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Confirms the app actually compiles end-to-end. Explicitly NOT
      # `flutter build apk`/`appbundle`/`ipa` -- store/release packaging is
      # out of scope for this pipeline by design (see project docs).
      - name: Build web
        run: flutter build web

  # Signed Android release verification. Runs only when the signing secrets
  # are configured (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
  # ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD); otherwise every step is
  # skipped. Secrets are written to files on the runner only, never echoed,
  # and nothing is uploaded or published.
  android-release:
    name: Android release build (signed, verified)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Skip without signing secrets
        if: env.KEYSTORE_B64 == ''
        run: echo "Signing secrets not configured; Android release verification skipped."

      - uses: actions/checkout@v4
        if: env.KEYSTORE_B64 != ''

      - uses: actions/setup-java@v4
        if: env.KEYSTORE_B64 != ''
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: env.KEYSTORE_B64 != ''
        with:
          channel: stable
          cache: true

      - name: Restore signing config
        if: env.KEYSTORE_B64 != ''
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release AAB and APK
        if: env.KEYSTORE_B64 != ''
        run: |
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release

      - name: Verify artifacts
        if: env.KEYSTORE_B64 != ''
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|uses-permission"
          if "$BT/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "Release APK is debuggable" && exit 1
          fi
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > /dev/null
          echo "AAB signature verified"

      - name: Remove signing files
        if: always() && env.KEYSTORE_B64 != ''
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
